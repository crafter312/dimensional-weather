// Top-level build file for multi-module project.

// Define common properties for all subprojects
ext {
    minecraft_version = "1.20.4"
    yarn_mappings = "1.20.4+build.3"
    loader_version = "0.15.7"
    mod_version = "1.1-1.20.4"
    maven_group = "net.thesquire"
    archives_base_name = "dimensionalweather"
    fabric_version = "0.96.4+1.20.4"
}

// Set the group and version for the entire project
group = ext.maven_group
version = ext.mod_version

allprojects {
    repositories {
        // Common repositories for all subprojects
        mavenCentral()
        // Add any other common repositories here if needed
    }
}

subprojects {
    apply plugin: 'java' // Apply java plugin to all subprojects

    // Configure Java version for all subprojects
    def targetJavaVersion = 17
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            it.options.release = targetJavaVersion
        }
    }

    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        // archivesBaseName will be set in specific subproject build.gradle files
    }
}